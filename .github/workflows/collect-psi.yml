name: Coleta PSI (PageSpeed Insights)

on:
  schedule:
    - cron: '17 3 * * 1'  # Semanal; opt-in depois de corrigir PSI_KEY
  workflow_dispatch:
    inputs:
      max_sites:
        description: 'Limite de sites (1-1000); visita os menos recentes primeiro'
        default: '1000'
        type: string
      seconds:
        description: 'Orcamento de coleta em segundos (1-1200)'
        default: '1200'
        type: string

# Single writer. A later dispatch must not cancel a snapshot in progress.
concurrency:
  group: psi-state
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    # Invalid key observed on 2026-10-25. No automatic retries until repaired.
    if: github.event_name == 'workflow_dispatch' || vars.PSI_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PAGESPEED_API_KEY: ${{ secrets.PSI_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_DIR: data/runs/psi-${{ github.run_id }}-${{ github.run_attempt }}
      MAX_SITES: ${{ inputs.max_sites || '1000' }}
      SECONDS_LIMIT: ${{ inputs.seconds || '1200' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v4
        with:
          version: '0.13.5'
      - name: Install reproducible dependencies
        run: uv sync --frozen
      - name: Validate budgets and credential presence
        run: |
          python - <<'PY'
          import os
          assert 1 <= int(os.environ['MAX_SITES']) <= 1000
          assert 1 <= int(os.environ['SECONDS_LIMIT']) <= 1200
          assert os.environ.get('PAGESPEED_API_KEY', '').strip(), 'PSI_KEY ausente'
          PY
      - name: Restore durable database (cache is not an archive)
        id: restore
        run: |
          mkdir -p data
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/psi-releases.json
          TAG=$(jq -r '[.[][] | select(.draft == false and (.tag_name | startswith("psi-state-")))] | sort_by(.published_at) | last | .tag_name // empty' /tmp/psi-releases.json)
          if [ -n "$TAG" ]; then
            mkdir -p restored
            gh release download "$TAG" --pattern 'rossio.duckdb' --pattern 'database.sha256' --dir restored
            (cd restored && sha256sum -c database.sha256)
            cp restored/rossio.duckdb data/rossio.duckdb
            echo "Restored $TAG" >> "$GITHUB_STEP_SUMMARY"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo 'Sem snapshot duravel anterior; primeiro banco Python. Os dados legados em Git permanecem preservados.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Recover legacy cache on first durable run
        if: steps.restore.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/rossio.duckdb
          key: psi-duckdb-migrate-${{ github.run_id }}
          restore-keys: psi-duckdb-
      - name: Bounded collection
        id: collect
        continue-on-error: true
        run: |
          uv run --frozen python -m rossio.scheduled --output "$RUN_DIR" \
            --max-sites "$MAX_SITES" --seconds "$SECONDS_LIMIT"
      - name: Publish Internet Archive snapshot when configured
        id: archive
        if: always() && steps.collect.outcome != 'skipped'
        continue-on-error: true
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          test -f "$RUN_DIR/manifest.json"
          uv run --frozen python -m rossio.scheduled --output "$RUN_DIR" --publish-only
      - name: Preserve database and complete run as immutable release
        if: always() && steps.collect.outcome != 'skipped'
        run: |
          test -f "$RUN_DIR/rossio.duckdb"
          test -f "$RUN_DIR.tar.gz"
          (cd "$RUN_DIR" && sha256sum rossio.duckdb > database.sha256)
          TAG="psi-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$TAG" "$RUN_DIR/rossio.duckdb" "$RUN_DIR/database.sha256" \
            "$RUN_DIR.tar.gz" "$RUN_DIR/manifest.json" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Snapshot PSI. Consulte manifest.json para cobertura, falhas e status do Internet Archive." --latest=false
      - name: Propose dashboard and quarantine updates
        if: steps.collect.outcome == 'success'
        run: |
          test -d "$RUN_DIR/dashboard"
          cp "$RUN_DIR/dashboard/"*.json docs/data/
          mkdir -p data/quarantine
          cp "$RUN_DIR/quarantine.json" data/quarantine/quarantine-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data/ data/quarantine/quarantine-latest.json
          if git diff --cached --quiet; then exit 0; fi
          BRANCH="automation/psi-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$BRANCH"
          git commit -m 'chore(psi): atualizar painel apos coleta limitada'
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title 'chore(psi): resultados de coleta limitada' \
            --body "Snapshot e cobertura: https://github.com/$GITHUB_REPOSITORY/releases/tag/psi-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT. Revisar antes de incorporar."
      - name: Recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/runs/
          retention-days: 7
          if-no-files-found: warn
      - name: Report actual outcome
        if: always() && steps.collect.outcome != 'skipped'
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
        run: |
          if [ -f "$RUN_DIR/manifest.json" ]; then cat "$RUN_DIR/manifest.json" >> "$GITHUB_STEP_SUMMARY"; fi
          test "$COLLECT_OUTCOME" = success
          test "$ARCHIVE_OUTCOME" = success
